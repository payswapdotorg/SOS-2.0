name: SOS repository verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-repo.mjs
      - run: node scripts/verify-productization.mjs
