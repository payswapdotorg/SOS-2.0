packages:
  - apps/*
  - packages/*
  # W17: the dogfood + adversarial suites are workspace packages so that
  # `pnpm -r --if-present test` includes them (work-order W17 task packet:
  # "extend the root vitest workspace so `pnpm -r test` includes your
  # suites"). Test-only wiring; no package source, app, spec or script is
  # touched by this entry.
  - tests/*
  # P3: the free-tier deployment foundation is a workspace package so that
  # `pnpm -r --if-present test` includes its deterministic contract suites
  # (work-order P3 task packet, following the W17 test-only wiring
  # precedent). The package declares ZERO dependencies — this line changes
  # no dependency graph and pnpm-lock.yaml remains byte-identical (pinned
  # by tests + CI); the test toolchain is borrowed at run time from the
  # frozen W17 suites via `pnpm --filter @sos-2/adversarial exec ...`.
  - infra/deployment
  # P17-A: the production-connectivity wiring harness is a workspace
  # package so that `pnpm -r --if-present test` includes its deterministic
  # wiring suites (work-order P17-A task packet, following the exact
  # infra-deployment wiring precedent — the one explicit infra/ entry this
  # lane adds; packages/* and tests/* already cover the lane's other new
  # importers). The harness composes @sos-2/real-persistence and
  # @sos-2/deployment-providers (workspace:* only — zero external
  # dependencies; the lockfile change is importer addition only).
  - infra/production-connectivity
  # P18-A: the live data plane + its data-plane suites are workspace
  # packages so their module boundaries resolve the merged P17 packages
  # (workspace:* only — zero external dependencies; the lockfile change
  # is importer addition only, the W17/P17-A precedent).
  #   - apps/web/live-data is the source-only server module (the P17-C
  #     app-module precedent — no build/dist of its own); the importer
  #     entry exists so its node_modules carries the real
  #     persistence/observation/deployment packages its sources import.
  #   - tests/live-ux/data-plane is the lane's two strictly separated
  #     suites (deterministic reference-mode default; env-gated
  #     RUN_REAL=1 real integration).
  - apps/web/live-data
  - tests/live-ux/data-plane
