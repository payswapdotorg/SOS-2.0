packages:
  - apps/*
  - packages/*
  # W17: the dogfood + adversarial suites are workspace packages so that
  # `pnpm -r --if-present test` includes them (work-order W17 task packet:
  # "extend the root vitest workspace so `pnpm -r test` includes your
  # suites"). Test-only wiring; no package source, app, spec or script is
  # touched by this entry.
  - tests/*
  # P3: the free-tier deployment foundation is a workspace package so that
  # `pnpm -r --if-present test` includes its deterministic contract suites
  # (work-order P3 task packet, following the W17 test-only wiring
  # precedent). The package declares ZERO dependencies — this line changes
  # no dependency graph and pnpm-lock.yaml remains byte-identical (pinned
  # by tests + CI); the test toolchain is borrowed at run time from the
  # frozen W17 suites via `pnpm --filter @sos-2/adversarial exec ...`.
  - infra/deployment
  # P17-A: the production-connectivity wiring harness is a workspace
  # package so that `pnpm -r --if-present test` includes its deterministic
  # wiring suites (work-order P17-A task packet, following the exact
  # infra-deployment wiring precedent — the one explicit infra/ entry this
  # lane adds; packages/* and tests/* already cover the lane's other new
  # importers). The harness composes @sos-2/real-persistence and
  # @sos-2/deployment-providers (workspace:* only — zero external
  # dependencies; the lockfile change is importer addition only).
  - infra/production-connectivity
  # P18-B: the live-actions composition seams + the live-ux actions suites
  # are workspace packages (work-order P18-B task packet, following the
  # exact P18-A apps/web/live-data importer precedent):
  #   - apps/web/app/mission is the source-only server module directory
  #     (the colocated non-route module beside the mission route — the
  #     P18-C start-surface colocation precedent); the importer entry
  #     exists so its node_modules carries the merged packages its
  #     sources import by name (@sos-2/action-gateway, @sos-2/ask,
  #     @sos-2/decision, @sos-2/authority, @sos-2/deployment-providers,
  #     @sos-2/real-bodies — none of which are inside the @sos-2/web
  #     build closure, and apps/web/package.json is outside this lane's
  #     owned surface). The P17-C UI module under apps/web (the mounted
  #     surface library) stays byte-identical to its base — its frozen
  #     structure suite pins it as a pure ambient-free UI module with
  #     restricted imports (see the lane README's architecture note).
  #   - tests/live-ux/actions is the lane's two strictly separated suites
  #     (deterministic reference-mode default; env-gated RUN_REAL=1 real
  #     integration), nested beside the sibling lanes' suites under
  #     tests/live-ux/ (the P18-A tests/live-ux/data-plane precedent).
  # workspace:* only — zero external registry dependencies; the lockfile
  # change is importer addition only.
  - apps/web/app/mission
  - tests/live-ux/actions
